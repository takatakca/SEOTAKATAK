name: SEOTAKATAK CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: bash -n scripts/deploy-coolify.sh scripts/test-sql.sh
      - name: PostgreSQL migration and tenant isolation checks
        run: bash scripts/test-sql.sh
      - run: docker build -t seotakatak:ci .
