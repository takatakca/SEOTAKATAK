name: Deploy SEOTAKATAK production
on:
  workflow_run:
    workflows: ["SEOTAKATAK CI"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: seotakatak-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout verified GitHub commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy through Coolify and verify database readiness
        env:
          COOLIFY_API_URL: ${{ vars.SEOTAKATAK_COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.SEOTAKATAK_COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.SEOTAKATAK_COOLIFY_APP_UUID }}
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          SEOTAKATAK_HEALTH_URL: ${{ vars.SEOTAKATAK_HEALTH_URL }}
        run: bash scripts/deploy-coolify.sh
